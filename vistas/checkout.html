<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForkMenu - Checkout</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <header>
        <div class="logo">
            <h1>ForkMenu</h1>
        </div>
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
        <div class="user-actions">
            <a href="login.html">Iniciar sesión</a> |
            <a href="registro.html">Registrar usuario</a>
            <a href="carrito.html" class="cart" id="contador-carrito">🛒 Cart (0)</a>
        </div>
    </header>

    <main>
        <section class="checkout">
            <h2>Finalizar Pedido</h2>

            <!-- Todo el proceso debe ser un formulario para que JS lo pueda interceptar -->
            <form id="form-checkout">
                
                <fieldset class="modalidad-pedido">
                    <legend>¿Cómo deseas recibir tu pedido?</legend>
                    <div class="opciones-tarjetas">
                        
                        <label class="tarjeta-opcion">
                            <input type="radio" name="modalidad" value="delivery" required>
                            <span class="icono">🛵</span>
                            <span class="texto">A Domicilio</span>
                        </label>
                
                        <label class="tarjeta-opcion">
                            <input type="radio" name="modalidad" value="retiro">
                            <span class="icono">🛍️</span>
                            <span class="texto">Retiro en local</span>
                        </label>
                
                        <label class="tarjeta-opcion">
                            <input type="radio" name="modalidad" value="mesa">
                            <span class="icono">🍽️</span>
                            <span class="texto">Consumo en mesa</span>
                        </label>
                    </div>
                </fieldset>

                <!-- Campos dinámicos ocultos por defecto -->
                <div id="campos-delivery" style="display: none;">
                    <div class="campo">
                        <label for="direccion">Dirección de entrega</label>
                        <input type="text" id="direccion" name="direccion" placeholder="Calle, número, comuna">
                    </div>
                </div>

                <div id="campos-mesa" style="display: none;">
                    <div class="campo">
                        <label for="numero-mesa">Número de mesa</label>
                        <input type="number" id="numero-mesa" name="numero-mesa" min="1" max="20" placeholder="Ej: 5">
                    </div>
                </div>

                <div class="campo">
                    <label for="metodo-pago">Método de pago</label>
                    <select id="metodo-pago" name="metodo-pago" required>
                        <option value="">Seleccione un método</option>
                        <option value="tarjeta">Tarjeta de Crédito / Débito</option>
                        <option value="efectivo">Efectivo al recibir</option>
                    </select>
                </div>

                <div class="resumen-pedido">
                    <h3>Resumen de tu pedido</h3>
                    <!-- JS inyectará los platos aquí -->
                    <ul id="resumen-items"></ul>
                    <p>Total a pagar: <span id="resumen-total">$0</span></p>
                </div>

                <button type="submit" class="btn btn-confirmar">Confirmar pedido</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ForkMenu. Todos los derechos reservados.</p>
    </footer>

    <script src="../js/validaciones.js"></script>
</body>
</html>
