<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForkMenu - Pedido confirmado</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <header>
        <div class="logo">
            <h1>ForkMenu</h1>
        </div>
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
        <div class="user-actions">
            <a href="login.html">Iniciar sesión</a> |
            <a href="registro.html">Registrar usuario</a>
            <a href="carrito.html" class="cart" id="contador-carrito">🛒 Cart (0)</a>
        </div>
    </header>

    <main>
        <section class="confirmacion">
            <h2>¡Gracias por tu pedido!</h2>

            <p class="codigo-pedido">Código de pedido: <strong id="codigo-pedido">Cargando...</strong></p>
            <p class="estado-pedido">Estado: <span id="estado-pedido">Procesando...</span></p>

            <div class="resumen-pedido">
                <h3>Resumen</h3>
                <!-- Contenedor vacío donde JS pondrá los platos reales comprados -->
                <ul id="resumen-items-confirmacion"></ul>
                <p>Total: <span id="total-confirmacion">$0</span></p>
            </div>

            <a href="../index.html" class="btn">Volver al inicio</a>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ForkMenu. Todos los derechos reservados.</p>
    </footer>
    <script src="../js/validaciones.js"></script>
</body>
</html>
