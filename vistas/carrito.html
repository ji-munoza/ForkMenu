<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForkMenu - Carrito de compras</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <header>
        <div class="logo">
            <h1>ForkMenu</h1>
        </div>
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
        <div class="user-actions">
            <a href="login.html">Iniciar sesión</a> |
            <a href="registro.html">Registrar usuario</a>
            <a href="carrito.html" class="cart" id="contador-carrito">🛒 Cart (0)</a>
        </div>
    </header>

    <main>
        <section class="carrito">
            <h2>Mi carrito de compras</h2>

            <!-- Contenedor vacío: JS inyectará los <article> aquí -->
            <div id="lista-carrito" class="lista-carrito">
                <!-- El contenido estático fue removido para evitar duplicidades -->
            </div>

            <div class="resumen-carrito">
                <p>Total: <span id="total-carrito">$0</span></p>

                <form id="form-cupon">
                    <label for="cupon">Ingresa el cupón de descuento</label>
                    <input type="text" id="cupon" name="cupon">
                    <button type="submit">Aplicar</button>
                </form>

                <a href="checkout.html" class="btn btn-pagar">Pagar</a>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ForkMenu. Todos los derechos reservados.</p>
    </footer>
    <script src="../js/validaciones.js"></script>
</body>
</html>
