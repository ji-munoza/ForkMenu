<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForkMenu - Carrito de compras</title>
    <!-- Bootstrap 5 CSS e Iconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Header / Navbar Principal -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
            <div class="container">
                <a class="navbar-brand fw-bold text-danger fs-3 d-flex align-items-center" href="../index.html">
                    <i class="bi bi-cup-hot-fill me-2"></i>ForkMenu
                </a>
                
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
                        <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                        <li class="nav-item"><a class="nav-link" href="blogs.html">Blogs</a></li>
                        <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                    </ul>

                    <!-- Contenedor manipulado dinámicamente por JS -->
                    <div class="user-actions d-flex align-items-center gap-2">
                        <a href="login.html" class="btn btn-outline-light btn-sm">Iniciar sesión</a>
                        <span class="text-white-50">|</span>
                        <a href="registro.html" class="btn btn-outline-light btn-sm">Registrar usuario</a>
                        <a href="carrito.html" class="btn btn-danger btn-sm ms-2 cart" id="contador-carrito">
                            <i class="bi bi-cart-fill me-1"></i> Cart (0)
                        </a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!-- Contenido Principal -->
    <main class="container my-5 flex-grow-1">
        <section class="carrito">
            <h2 class="h3 fw-bold mb-4 d-flex align-items-center">
                <i class="bi bi-cart3 me-2 text-danger"></i>Mi carrito de compras
            </h2>

            <div class="row g-4">
                <!-- Listado Dinámico de Productos -->
                <div class="col-lg-8">
                    <div class="card shadow-sm border-0 rounded-3 p-3">
                        <div id="lista-carrito" class="lista-carrito">
                            <!-- JS inyectará los elementos aquí -->
                        </div>
                    </div>
                </div>

                <!-- Resumen de Compra -->
                <div class="col-lg-4">
                    <div class="card shadow-sm border-0 rounded-3 p-4 sticky-top" style="top: 90px;">
                        <h3 class="h5 fw-bold mb-3 border-bottom pb-2">Resumen del pedido</h3>
                        
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <span class="fs-5 text-muted">Total:</span>
                            <span id="total-carrito" class="fs-3 fw-bold text-danger">$0</span>
                        </div>

                        <a href="checkout.html" class="btn btn-danger btn-lg w-100 fw-bold shadow-sm btn-pagar">
                            Ir a Pagar <i class="bi bi-arrow-right-short ms-1"></i>
                        </a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-4 mt-auto border-top border-secondary">
        <div class="container">
            <p class="mb-0 text-white-50">&copy; 2026 ForkMenu. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- Scripts de Bootstrap y Lógica JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/validaciones.js"></script>
</body>
</html>
