<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForkMenu Admin - Mantenedor de Productos</title>
    <!-- Bootstrap 5 CSS e Iconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <div class="admin-wrapper">
        <!-- Sidebar Lateral de Administración -->
        <aside class="admin-sidebar p-3 d-flex flex-column justify-content-between">
            <div>
                <a href="#" class="d-flex align-items-center mb-4 text-white text-decoration-none fs-4 fw-bold">
                    <i class="bi bi-cup-hot-fill text-danger me-2"></i> ForkMenu
                </a>
                <ul class="nav nav-pills flex-column">
                    <li class="nav-item">
                        <a href="pedidos.html" class="nav-link"><i class="bi bi-receipt me-2"></i> Pedidos</a>
                    </li>
                    <li class="nav-item">
                        <a href="productos-admin.html" class="nav-link active"><i class="bi bi-box-seam me-2"></i> Productos</a>
                    </li>
                    <li class="nav-item">
                        <a href="usuarios-admin.html" class="nav-link"><i class="bi bi-people me-2"></i> Usuarios</a>
                    </li>
                </ul>
            </div>
            <div>
                <a href="../index.html" class="btn btn-outline-light w-100"><i class="bi bi-shop me-2"></i> Ir a la Tienda</a>
            </div>
        </aside>

        <!-- Contenido Principal -->
        <main class="admin-content">
            <h2 class="h3 mb-4 fw-bold">Gestión y Registro de Productos</h2>

            <!-- Formulario en Card -->
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-white py-3">
                    <h5 class="card-title mb-0 fw-bold">Agregar / Editar Producto</h5>
                </div>
                <div class="card-body">
                    <form id="form-producto" class="row g-3">
                        <div class="col-md-3">
                            <label for="codigo-prod" class="form-label fw-semibold">Código de Producto</label>
                            <input type="text" class="form-control" id="codigo-prod" minlength="3" placeholder="Ej: FM-105" required>
                        </div>
                        <div class="col-md-5">
                            <label for="nombre-prod" class="form-label fw-semibold">Nombre</label>
                            <input type="text" class="form-control" id="nombre-prod" maxlength="100" required>
                        </div>
                        <div class="col-md-4">
                            <label for="categoria-prod" class="form-label fw-semibold">Categoría</label>
                            <select id="categoria-prod" class="form-select" required>
                                <option value="">Seleccione categoría</option>
                                <option value="hamburguesas">Hamburguesas</option>
                                <option value="pizzas">Pizzas</option>
                                <option value="bebidas">Bebidas</option>
                                <option value="postres">Postres</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="precio-prod" class="form-label fw-semibold">Precio</label>
                            <input type="number" class="form-control" id="precio-prod" min="0" required>
                        </div>
                        <div class="col-md-4">
                            <label for="stock-prod" class="form-label fw-semibold">Stock Total</label>
                            <input type="number" class="form-control" id="stock-prod" min="0" required>
                        </div>
                        <div class="col-md-4">
                            <label for="stock-critico" class="form-label fw-semibold">Stock Crítico (Alerta)</label>
                            <input type="number" class="form-control" id="stock-critico" min="0">
                        </div>
                        <div class="col-12 text-end">
                            <button type="submit" class="btn btn-danger px-4 fw-semibold">
                                <i class="bi bi-save me-1"></i> Guardar Producto
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Tabla de Control de Stock -->
            <div class="card shadow-sm">
                <div class="card-header bg-white py-3">
                    <h5 class="card-title mb-0 fw-bold">Inventario y Control de Stock</h5>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Código</th>
                                    <th>Producto</th>
                                    <th>Precio</th>
                                    <th>Stock Actual</th>
                                    <th>Stock Crítico</th>
                                    <th>Categoría</th>
                                    <th>Acción</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-productos-body">
                                <!-- Carga dinámica mediante JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts de Bootstrap y Lógica JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/validaciones.js"></script>
</body>
</html>
