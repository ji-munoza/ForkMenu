<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForkMenu - Registro de usuario</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <header>
        <div class="logo">
            <h1>ForkMenu</h1>
        </div>
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
        <div class="user-actions">
            <a href="login.html">Iniciar sesión</a>
            <a href="carrito.html" class="cart">🛒 Cart (0)</a>
        </div>
    </header>

    <main>
        <section class="registro">
            <h2>Registro de usuario</h2>

            <form id="form-registro" novalidate>
                <div class="campo">
                    <label for="run">RUN</label>
                    <input type="text" id="run" name="run" minlength="7" maxlength="9"
                           placeholder="Ej: 19011022K" required>
                    <span class="mensaje-error" id="error-run"></span>
                </div>

                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" maxlength="50" required>
                    <span class="mensaje-error" id="error-nombre"></span>
                </div>

                <div class="campo">
                    <label for="apellidos">Apellidos</label>
                    <input type="text" id="apellidos" name="apellidos" maxlength="100" required>
                    <span class="mensaje-error" id="error-apellidos"></span>
                </div>

                <div class="campo">
                    <label for="correo">Correo</label>
                    <input type="email" id="correo" name="correo" maxlength="100" required>
                    <span class="mensaje-error" id="error-correo"></span>
                </div>

                <div class="campo">
                    <label for="fecha-nacimiento">Fecha de nacimiento</label>
                    <input type="date" id="fecha-nacimiento" name="fecha-nacimiento">
                    <span class="mensaje-error" id="error-fecha-nacimiento"></span>
                </div>

                <div class="campo">
                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="contrasena" name="contrasena" minlength="4" maxlength="10" required>
                    <span class="mensaje-error" id="error-contrasena"></span>
                </div>

                <div class="campo">
                    <label for="confirmar-contrasena">Confirmar contraseña</label>
                    <input type="password" id="confirmar-contrasena" name="confirmar-contrasena" minlength="4" maxlength="10" required>
                    <span class="mensaje-error" id="error-confirmar-contrasena"></span>
                </div>

                <div class="campo">
                    <label for="region">Región</label>
                    <select id="region" name="region" required>
                        <option value="">-- Seleccione la región --</option>
                        <option value="metropolitana">Región Metropolitana de Santiago</option>
                        <option value="araucania">Región de la Araucanía</option>
                        <option value="nuble">Región de Ñuble</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="comuna">Comuna</label>
                    <!-- Se llenará dinámicamente según la región elegida en la Fase 5/6 -->
                    <select id="comuna" name="comuna" required>
                        <option value="">-- Seleccione la comuna --</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="direccion">Dirección</label>
                    <input type="text" id="direccion" name="direccion" maxlength="300" required>
                    <span class="mensaje-error" id="error-direccion"></span>
                </div>

                <button type="submit">Registrar</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ForkMenu. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
