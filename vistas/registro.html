<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForkMenu - Registro de usuario</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <header>
        <div class="logo">
            <h1>ForkMenu</h1>
        </div>
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
        <div class="user-actions">
            <a href="login.html">Iniciar sesión</a>
            <a href="carrito.html" class="cart" id="contador-carrito">🛒 Cart (0)</a>
        </div>
    </header>

    <main>
        <section class="registro">
            <h2>Registro de usuario</h2>

            <!-- El id="form-registro" es vital para que JS atrape el botón de envío -->
            <form id="form-registro" novalidate>
                <div class="campo">
                    <label for="run">RUN</label>
                    <!-- Quitamos los minlength del HTML para que JS controle todo dinámicamente -->
                    <input type="text" id="run" name="run" placeholder="Ej: 19011022K">
                    <span class="mensaje-error" id="error-run"></span>
                </div>

                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre">
                    <span class="mensaje-error" id="error-nombre"></span>
                </div>

                <div class="campo">
                    <label for="apellidos">Apellidos</label>
                    <input type="text" id="apellidos" name="apellidos">
                    <span class="mensaje-error" id="error-apellidos"></span>
                </div>

                <div class="campo">
                    <label for="correo">Correo</label>
                    <input type="email" id="correo" name="correo">
                    <span class="mensaje-error" id="error-correo"></span>
                </div>

                <div class="campo">
                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="contrasena" name="contrasena">
                    <span class="mensaje-error" id="error-contrasena"></span>
                </div>

                <div class="campo">
                    <label for="confirmar-contrasena">Confirmar contraseña</label>
                    <input type="password" id="confirmar-contrasena" name="confirmar-contrasena">
                    <span class="mensaje-error" id="error-confirmar-contrasena"></span>
                </div>

                <div class="campo">
                    <label for="region">Región</label>
                    <select id="region" name="region">
                        <option value="">-- Seleccione la región --</option>
                        <option value="metropolitana">Región Metropolitana de Santiago</option>
                        <option value="valparaiso">Región de Valparaíso</option>
                        <option value="nuble">Región de Ñuble</option>
                        <option value="bioBio">Región del Biobío</option>
                        <option value="araucania">Región de la Araucanía</option>
                    </select>
                    <span class="mensaje-error" id="error-region"></span>
                </div>

                <div class="campo">
                    <label for="comuna">Comuna</label>
                    <select id="comuna" name="comuna">
                        <option value="">-- Seleccione la comuna --</option>
                    </select>
                    <span class="mensaje-error" id="error-comuna"></span>
                </div>

                <div class="campo">
                    <label for="direccion">Dirección</label>
                    <input type="text" id="direccion" name="direccion">
                    <span class="mensaje-error" id="error-direccion"></span>
                </div>

                <button type="submit" class="btn">Registrar</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ForkMenu. Todos los derechos reservados.</p>
    </footer>

    <script src="../js/validaciones.js"></script>
</body>
</html>
