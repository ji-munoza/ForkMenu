<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForkMenu - Contacto</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <header>
        <div class="logo">
            <h1>ForkMenu</h1>
        </div>
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
        <div class="user-actions">
            <a href="login.html">Iniciar sesión</a> |
            <a href="registro.html">Registrar usuario</a>
            <!-- Se agregó el ID del contador para que JS mantenga el carrito sincronizado -->
            <a href="carrito.html" class="cart" id="contador-carrito">🛒 Cart (0)</a>
        </div>
    </header>

    <main>
        <section class="contacto">
            <h2>Contáctanos</h2>

            <form id="form-contacto" novalidate>
                <div class="campo">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" maxlength="100" required>
                    <span class="mensaje-error" id="error-nombre"></span>
                </div>

                <div class="campo">
                    <label for="correo">Correo</label>
                    <!-- Se agregó el atributo 'required' faltante -->
                    <input type="email" id="correo" name="correo" maxlength="100" required>
                    <span class="mensaje-error" id="error-correo"></span>
                </div>

                <div class="campo">
                    <label for="mensaje">Mensaje</label>
                    <textarea id="mensaje" name="mensaje" maxlength="500" required></textarea>
                    <span class="mensaje-error" id="error-mensaje"></span>
                </div>

                <!-- Se agregó la clase 'btn' para mantener la consistencia visual -->
                <button type="submit" class="btn">Enviar mensaje</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ForkMenu. Todos los derechos reservados.</p>
    </footer>

    <!-- Etiqueta conectora con tu JavaScript -->
    <script src="../js/validaciones.js"></script>
</body>
</html>
