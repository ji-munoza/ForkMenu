<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForkMenu - Productos</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <header>
        <div class="logo">
            <h1>ForkMenu</h1>
        </div>
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
        <div class="user-actions">
            <a href="login.html">Iniciar sesión</a> |
            <a href="registro.html">Registrar usuario</a>
            <a href="carrito.html" class="cart" id="contador-carrito">🛒 Cart (0)</a>
        </div>
    </header>

    <main>
        <section class="productos-listado">
            <h2>Nuestros Productos</h2>

            <div class="filtros-productos">
                <label for="buscar-producto" class="visually-hidden">Buscar producto</label>
                <input type="search" id="buscar-producto" name="buscar-producto" placeholder="Buscar producto...">

                <nav class="tabs-categoria" aria-label="Filtrar por categoría">
                    <button type="button" class="tab-categoria activo" data-categoria="todas">Todas</button>
                    <button type="button" class="tab-categoria" data-categoria="hamburguesas">Hamburguesas</button>
                    <button type="button" class="tab-categoria" data-categoria="pizzas">Pizzas</button>
                    <button type="button" class="tab-categoria" data-categoria="bebidas">Bebidas</button>
                    <button type="button" class="tab-categoria" data-categoria="postres">Postres</button>
                </nav>
            </div>

            <div class="grilla-productos" id="grilla-productos">

                <article class="producto" data-categoria="hamburguesas">
                    <a href="detalle-producto.html?id=1">
                        <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=600&q=80" alt="Hamburguesa Clásica">
                        <h3>Hamburguesa Clásica</h3>
                    </a>
                    <p class="precio">$8.000</p>
                    <button type="button" class="btn-agregar" data-id="1" data-nombre="Hamburguesa Clásica" data-precio="8000">Añadir al carrito</button>
                </article>

                <article class="producto" data-categoria="pizzas">
                    <a href="detalle-producto.html?id=2">
                        <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=600&q=80" alt="Pizza Margarita">
                        <h3>Pizza Margarita</h3>
                    </a>
                    <p class="precio">$10.000</p>
                    <button type="button" class="btn-agregar" data-id="2" data-nombre="Pizza Margarita" data-precio="10000">Añadir al carrito</button>
                </article>

                <article class="producto" data-categoria="postres">
                    <a href="detalle-producto.html?id=3">
                        <img src="https://images.unsplash.com/photo-1571115177098-24ec28bc92f6?auto=format&fit=crop&w=600&q=80" alt="Tiramisú">
                        <h3>Tiramisú</h3>
                    </a>
                    <p class="precio">$5.500</p>
                    <button type="button" class="btn-agregar" data-id="3" data-nombre="Tiramisú" data-precio="5500">Añadir al carrito</button>
                </article>

                <article class="producto" data-categoria="bebidas">
                    <a href="detalle-producto.html?id=4">
                        <img src="https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?auto=format&fit=crop&w=600&q=80" alt="Limonada Natural">
                        <h3>Limonada Natural</h3>
                    </a>
                    <p class="precio">$3.000</p>
                    <button type="button" class="btn-agregar" data-id="4" data-nombre="Limonada Natural" data-precio="3000">Añadir al carrito</button>
                </article>

            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ForkMenu. Todos los derechos reservados.</p>
    </footer>
    <script src="../js/validaciones.js"></script>
</body>
</html>
