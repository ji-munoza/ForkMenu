<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForkMenu - Productos</title>
    <!-- Bootstrap 5 CSS e Iconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Header / Navbar Principal -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
            <div class="container">
                <a class="navbar-brand fw-bold text-danger fs-3 d-flex align-items-center" href="../index.html">
                    <i class="bi bi-cup-hot-fill me-2"></i>ForkMenu
                </a>
                
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link active" href="productos.html">Productos</a></li>
                        <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                        <li class="nav-item"><a class="nav-link" href="blogs.html">Blogs</a></li>
                        <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                    </ul>

                    <!-- Contenedor manipulado dinámicamente por JS -->
                    <div class="user-actions d-flex align-items-center gap-2">
                        <a href="login.html" class="btn btn-outline-light btn-sm">Iniciar sesión</a>
                        <span class="text-white-50">|</span>
                        <a href="registro.html" class="btn btn-outline-light btn-sm">Registrar usuario</a>
                        <a href="carrito.html" class="btn btn-danger btn-sm ms-2 cart" id="contador-carrito">
                            <i class="bi bi-cart-fill me-1"></i> Cart (0)
                        </a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!-- Contenido Principal -->
    <main class="container my-5 flex-grow-1">
        <section class="productos-listado">
            <div class="mb-4">
                <h2 class="h3 fw-bold mb-0 d-flex align-items-center">
                    <i class="bi bi-journal-richtext me-2 text-danger"></i>Nuestros Productos
                </h2>
            </div>

            <!-- Filtros y Búsqueda -->
            <div class="card shadow-sm border-0 rounded-3 p-3 mb-4 bg-white filtros-productos">
                <div class="row g-3 align-items-center">
                    <div class="col-lg-4">
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-search"></i></span>
                            <input type="search" id="buscar-producto" name="buscar-producto" class="form-control bg-light border-start-0" placeholder="Buscar producto...">
                        </div>
                    </div>
                    <div class="col-lg-8">
                        <nav class="tabs-categoria d-flex flex-wrap gap-2 justify-content-lg-end" aria-label="Filtrar por categoría">
                            <button type="button" class="btn btn-outline-danger btn-sm tab-categoria activo" data-categoria="todas">Todas</button>
                            <button type="button" class="btn btn-outline-danger btn-sm tab-categoria" data-categoria="hamburguesas">Hamburguesas</button>
                            <button type="button" class="btn btn-outline-danger btn-sm tab-categoria" data-categoria="pizzas">Pizzas</button>
                            <button type="button" class="btn btn-outline-danger btn-sm tab-categoria" data-categoria="bebidas">Bebidas</button>
                            <button type="button" class="btn btn-outline-danger btn-sm tab-categoria" data-categoria="postres">Postres</button>
                        </nav>
                    </div>
                </div>
            </div>

            <!-- Grilla de Productos -->
            <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-4 grilla-productos" id="grilla-productos">

                <!-- Producto 1 -->
                <div class="col">
                    <article class="card h-100 shadow-sm border-0 rounded-3 overflow-hidden producto" data-categoria="hamburguesas">
                        <a href="detalle-producto.html?id=1" class="text-decoration-none">
                            <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=600&q=80" class="card-img-top object-fit-cover" alt="Hamburguesa Clásica" style="height: 200px;">
                        </a>
                        <div class="card-body d-flex flex-column p-3">
                            <a href="detalle-producto.html?id=1" class="text-decoration-none text-dark">
                                <h3 class="h6 fw-bold mb-2">Hamburguesa Clásica</h3>
                            </a>
                            <p class="precio text-danger fw-bold fs-5 mb-3">$8.000</p>
                            <button type="button" class="btn btn-outline-danger btn-sm mt-auto w-100 fw-semibold btn-agregar" data-id="1" data-nombre="Hamburguesa Clásica" data-precio="8000">
                                <i class="bi bi-cart-plus me-1"></i> Añadir al carrito
                            </button>
                        </div>
                    </article>
                </div>

                <!-- Producto 2 -->
                <div class="col">
                    <article class="card h-100 shadow-sm border-0 rounded-3 overflow-hidden producto" data-categoria="pizzas">
                        <a href="detalle-producto.html?id=2" class="text-decoration-none">
                            <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=600&q=80" class="card-img-top object-fit-cover" alt="Pizza Margarita" style="height: 200px;">
                        </a>
                        <div class="card-body d-flex flex-column p-3">
                            <a href="detalle-producto.html?id=2" class="text-decoration-none text-dark">
                                <h3 class="h6 fw-bold mb-2">Pizza Margarita</h3>
                            </a>
                            <p class="precio text-danger fw-bold fs-5 mb-3">$10.000</p>
                            <button type="button" class="btn btn-outline-danger btn-sm mt-auto w-100 fw-semibold btn-agregar" data-id="2" data-nombre="Pizza Margarita" data-precio="10000">
                                <i class="bi bi-cart-plus me-1"></i> Añadir al carrito
                            </button>
                        </div>
                    </article>
                </div>

                <!-- Producto 3 -->
                <div class="col">
                    <article class="card h-100 shadow-sm border-0 rounded-3 overflow-hidden producto" data-categoria="postres">
                        <a href="detalle-producto.html?id=3" class="text-decoration-none">
                            <img src="https://images.unsplash.com/photo-1571115177098-24ec28bc92f6?auto=format&fit=crop&w=600&q=80" class="card-img-top object-fit-cover" alt="Tiramisú" style="height: 200px;">
                        </a>
                        <div class="card-body d-flex flex-column p-3">
                            <a href="detalle-producto.html?id=3" class="text-decoration-none text-dark">
                                <h3 class="h6 fw-bold mb-2">Tiramisú</h3>
                            </a>
                            <p class="precio text-danger fw-bold fs-5 mb-3">$5.500</p>
                            <button type="button" class="btn btn-outline-danger btn-sm mt-auto w-100 fw-semibold btn-agregar" data-id="3" data-nombre="Tiramisú" data-precio="5500">
                                <i class="bi bi-cart-plus me-1"></i> Añadir al carrito
                            </button>
                        </div>
                    </article>
                </div>

                <!-- Producto 4 -->
                <div class="col">
                    <article class="card h-100 shadow-sm border-0 rounded-3 overflow-hidden producto" data-categoria="bebidas">
                        <a href="detalle-producto.html?id=4" class="text-decoration-none">
                            <img src="https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?auto=format&fit=crop&w=600&q=80" class="card-img-top object-fit-cover" alt="Limonada Natural" style="height: 200px;">
                        </a>
                        <div class="card-body d-flex flex-column p-3">
                            <a href="detalle-producto.html?id=4" class="text-decoration-none text-dark">
                                <h3 class="h6 fw-bold mb-2">Limonada Natural</h3>
                            </a>
                            <p class="precio text-danger fw-bold fs-5 mb-3">$3.000</p>
                            <button type="button" class="btn btn-outline-danger btn-sm mt-auto w-100 fw-semibold btn-agregar" data-id="4" data-nombre="Limonada Natural" data-precio="3000">
                                <i class="bi bi-cart-plus me-1"></i> Añadir al carrito
                            </button>
                        </div>
                    </article>
                </div>

            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-4 mt-auto border-top border-secondary">
        <div class="container">
            <p class="mb-0 text-white-50">&copy; 2026 ForkMenu. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- Scripts de Bootstrap y Lógica JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/validaciones.js"></script>
</body>
</html>
