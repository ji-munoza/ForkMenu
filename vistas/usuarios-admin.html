<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForkMenu Admin - Mantenedor de Usuarios</title>
    <!-- Bootstrap 5 CSS e Iconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <div class="admin-wrapper">
        <!-- Sidebar Lateral de Administración -->
        <aside class="admin-sidebar p-3 d-flex flex-column justify-content-between">
            <div>
                <a href="#" class="d-flex align-items-center mb-4 text-white text-decoration-none fs-4 fw-bold">
                    <i class="bi bi-cup-hot-fill text-danger me-2"></i> ForkMenu
                </a>
                <ul class="nav nav-pills flex-column">
                    <li class="nav-item">
                        <a href="pedidos.html" class="nav-link"><i class="bi bi-receipt me-2"></i> Pedidos</a>
                    </li>
                    <li class="nav-item">
                        <a href="productos-admin.html" class="nav-link"><i class="bi bi-box-seam me-2"></i> Productos</a>
                    </li>
                    <li class="nav-item">
                        <a href="usuarios-admin.html" class="nav-link active"><i class="bi bi-people me-2"></i> Usuarios</a>
                    </li>
                </ul>
            </div>
            <div>
                <a href="../index.html" class="btn btn-outline-light w-100"><i class="bi bi-shop me-2"></i> Ir a la Tienda</a>
            </div>
        </aside>

        <!-- Contenido Principal -->
        <main class="admin-content">
            <h2 class="h3 mb-4 fw-bold">Gestión de Usuarios y Roles</h2>
            
            <!-- Formulario en Card -->
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-white py-3">
                    <h5 class="card-title mb-0 fw-bold">Crear / Asignar Rol de Usuario</h5>
                </div>
                <div class="card-body">
                    <form id="form-usuario-admin" class="row g-3">
                        <div class="col-md-4">
                            <label for="run-usuario" class="form-label fw-semibold">RUN</label>
                            <input type="text" class="form-control" id="run-usuario" placeholder="Ej: 19011022K" required>
                        </div>
                        
                        <div class="col-md-4">
                            <label for="correo-usuario" class="form-label fw-semibold">Correo Electrónico</label>
                            <input type="email" class="form-control" id="correo-usuario" placeholder="ejemplo@duoc.cl" required>
                        </div>

                        <div class="col-md-4">
                            <label for="rol-usuario" class="form-label fw-semibold">Tipo de Usuario (Rol)</label>
                            <select id="rol-usuario" class="form-select" required>
                                <option value="cliente">Cliente (Solo Tienda)</option>
                                <option value="vendedor">Vendedor (Ver Pedidos)</option>
                                <option value="admin">Administrador (Acceso Total)</option>
                            </select>
                        </div>

                        <div class="col-12 text-end">
                            <button type="submit" class="btn btn-danger px-4 fw-semibold">
                                <i class="bi bi-person-plus me-1"></i> Crear Usuario
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Tabla de Usuarios Registrados -->
            <div class="card shadow-sm">
                <div class="card-header bg-white py-3">
                    <h5 class="card-title mb-0 fw-bold">Lista de Usuarios del Sistema</h5>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>RUN / Nombre</th>
                                    <th>Correo</th>
                                    <th>Rol Asignado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-usuarios-body">
                                <!-- JS inyectará los usuarios registrados dinámicamente -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts de Bootstrap y Lógica JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/validaciones.js"></script>
</body>
</html>
