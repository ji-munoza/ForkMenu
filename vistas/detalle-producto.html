<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForkMenu - Detalle del producto</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <header>
        <div class="logo">
            <h1>ForkMenu</h1>
        </div>
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
        <div class="user-actions">
            <a href="login.html">Iniciar sesión</a> |
            <a href="registro.html">Registrar usuario</a>
            <a href="carrito.html" class="cart" id="contador-carrito">🛒 Cart (0)</a>
        </div>
    </header>

    <main>
        <nav class="breadcrumb" aria-label="Ruta de navegación">
            <a href="../index.html">Home</a> &gt;
            <a href="productos.html">Productos</a> &gt;
            <span id="breadcrumb-nombre">Cargando...</span>
        </nav>

        <section class="detalle-producto">
            <div class="galeria">
                <!-- Se agregó un ID para cambiar la imagen con JS -->
                <img id="detalle-imagen" src="" alt="Cargando producto" style="width: 100%; border-radius: 12px; object-fit: cover;">
            </div>

            <div class="info-producto">
                <!-- Se agregaron IDs al nombre, precio y descripción -->
                <h2 id="detalle-nombre">Cargando...</h2>
                <p class="precio" id="detalle-precio">$0</p>
                <p class="descripcion" id="detalle-descripcion">
                    Por favor espera, estamos cargando la información del producto.
                </p>

                <form>
                    <div class="campo">
                        <label for="tamano">Tamaño</label>
                        <select id="tamano" name="tamano">
                            <option value="individual">Individual</option>
                            <option value="doble">Doble</option>
                        </select>
                    </div>

                    <label for="cantidad">Cantidad</label>
                    <input type="number" id="cantidad" name="cantidad" value="1" min="1">
                    
                    <!-- Este botón no tiene atributos data- aún, JS se los inyectará cuando cargue el producto -->
                    <button type="button" class="btn-agregar" id="detalle-btn-agregar">Añadir al carrito</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ForkMenu. Todos los derechos reservados.</p>
    </footer>
    <script src="../js/validaciones.js"></script>
</body>
</html>
