<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForkMenu - Contacto</title>
    <!-- Bootstrap 5 CSS e Iconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Header / Navbar Principal -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
            <div class="container">
                <a class="navbar-brand fw-bold text-danger fs-3 d-flex align-items-center" href="../index.html">
                    <i class="bi bi-cup-hot-fill me-2"></i>ForkMenu
                </a>
                
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
                        <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                        <li class="nav-item"><a class="nav-link" href="blogs.html">Blogs</a></li>
                        <li class="nav-item"><a class="nav-link active" href="contacto.html">Contacto</a></li>
                    </ul>

                    <!-- Contenedor manipulado dinámicamente por JS -->
                    <div class="user-actions d-flex align-items-center gap-2">
                        <a href="login.html" class="btn btn-outline-light btn-sm">Iniciar sesión</a>
                        <span class="text-white-50">|</span>
                        <a href="registro.html" class="btn btn-outline-light btn-sm">Registrar usuario</a>
                        <a href="carrito.html" class="btn btn-danger btn-sm ms-2 cart" id="contador-carrito">
                            <i class="bi bi-cart-fill me-1"></i> Cart (0)
                        </a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!-- Contenido Principal -->
    <main class="container my-5 flex-grow-1 d-flex align-items-center justify-content-center">
        <section class="contacto w-100" style="max-width: 650px;">
            <div class="card shadow-sm border-0 rounded-3 p-4 p-md-5 bg-white">
                <div class="text-center mb-4">
                    <i class="bi bi-envelope-paper-fill fs-1 text-danger"></i>
                    <h2 class="h3 fw-bold mt-2">Contáctanos</h2>
                    <p class="text-muted fs-6">Escríbenos tus dudas o comentarios y te responderemos a la brevedad.</p>
                </div>

                <form id="form-contacto" novalidate class="row g-3">
                    <div class="campo col-12">
                        <label for="nombre" class="form-label fw-semibold">Nombre completo</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" maxlength="100" required placeholder="Ej: Juan Pérez">
                        <span class="mensaje-error text-danger small mt-1 d-block" id="error-nombre"></span>
                    </div>

                    <div class="campo col-12">
                        <label for="correo" class="form-label fw-semibold">Correo</label>
                        <input type="email" class="form-control" id="correo" name="correo" maxlength="100" required placeholder="ejemplo@duoc.cl">
                        <span class="mensaje-error text-danger small mt-1 d-block" id="error-correo"></span>
                    </div>

                    <div class="campo col-12">
                        <label for="mensaje" class="form-label fw-semibold">Mensaje</label>
                        <textarea class="form-control" id="mensaje" name="mensaje" rows="4" maxlength="500" required placeholder="Escribe tu mensaje aquí..."></textarea>
                        <span class="mensaje-error text-danger small mt-1 d-block" id="error-mensaje"></span>
                    </div>

                    <div class="col-12 mt-4">
                        <button type="submit" class="btn btn-danger w-100 btn-lg fw-bold shadow-sm">
                            <i class="bi bi-send-fill me-2"></i>Enviar mensaje
                        </button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-4 mt-auto border-top border-secondary">
        <div class="container">
            <p class="mb-0 text-white-50">&copy; 2026 ForkMenu. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- Scripts de Bootstrap y Lógica JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/validaciones.js"></script>
</body>
</html>
