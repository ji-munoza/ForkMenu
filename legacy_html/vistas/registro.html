<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForkMenu - Registro de usuario</title>
    <!-- Bootstrap 5 CSS e Iconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Header / Navbar Principal -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
            <div class="container">
                <a class="navbar-brand fw-bold text-danger fs-3 d-flex align-items-center" href="../index.html">
                    <i class="bi bi-cup-hot-fill me-2"></i>ForkMenu
                </a>
                
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
                        <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                        <li class="nav-item"><a class="nav-link" href="blogs.html">Blogs</a></li>
                        <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                    </ul>

                    <!-- Contenedor manipulado dinámicamente por JS -->
                    <div class="user-actions d-flex align-items-center gap-2">
                        <a href="login.html" class="btn btn-outline-light btn-sm">Iniciar sesión</a>
                        <span class="text-white-50">|</span>
                        <a href="registro.html" class="btn btn-outline-light btn-sm active">Registrar usuario</a>
                        <a href="carrito.html" class="btn btn-danger btn-sm ms-2 cart" id="contador-carrito">
                            <i class="bi bi-cart-fill me-1"></i> Cart (0)
                        </a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!-- Contenido Principal -->
    <main class="container my-5 flex-grow-1 d-flex align-items-center justify-content-center">
        <section class="registro w-100" style="max-width: 650px;">
            <div class="card shadow-sm border-0 rounded-3 p-4 p-md-5 bg-white">
                <div class="text-center mb-4">
                    <i class="bi bi-person-plus-fill fs-1 text-danger"></i>
                    <h2 class="h3 fw-bold mt-2">Registro de usuario</h2>
                    <p class="text-muted fs-6">Completa tus datos para crear tu cuenta en ForkMenu</p>
                </div>

                <form id="form-registro" novalidate class="row g-3">
                    <!-- RUN -->
                    <div class="campo col-12">
                        <label for="run" class="form-label fw-semibold">RUN</label>
                        <input type="text" class="form-control" id="run" name="run" placeholder="Ej: 19011022K">
                        <span class="mensaje-error text-danger small mt-1 d-block" id="error-run"></span>
                    </div>

                    <!-- Nombre -->
                    <div class="campo col-md-6">
                        <label for="nombre" class="form-label fw-semibold">Nombre</label>
                        <input type="text" class="form-control" id="nombre" name="nombre">
                        <span class="mensaje-error text-danger small mt-1 d-block" id="error-nombre"></span>
                    </div>

                    <!-- Apellidos -->
                    <div class="campo col-md-6">
                        <label for="apellidos" class="form-label fw-semibold">Apellidos</label>
                        <input type="text" class="form-control" id="apellidos" name="apellidos">
                        <span class="mensaje-error text-danger small mt-1 d-block" id="error-apellidos"></span>
                    </div>

                    <!-- Correo -->
                    <div class="campo col-12">
                        <label for="correo" class="form-label fw-semibold">Correo Electrónico</label>
                        <input type="email" class="form-control" id="correo" name="correo" placeholder="ejemplo@duoc.cl">
                        <span class="mensaje-error text-danger small mt-1 d-block" id="error-correo"></span>
                    </div>

                    <!-- Contraseña -->
                    <div class="campo col-md-6">
                        <label for="contrasena" class="form-label fw-semibold">Contraseña</label>
                        <input type="password" class="form-control" id="contrasena" name="contrasena" placeholder="••••••••">
                        <span class="mensaje-error text-danger small mt-1 d-block" id="error-contrasena"></span>
                    </div>

                    <!-- Confirmar Contraseña -->
                    <div class="campo col-md-6">
                        <label for="confirmar-contrasena" class="form-label fw-semibold">Confirmar contraseña</label>
                        <input type="password" class="form-control" id="confirmar-contrasena" name="confirmar-contrasena" placeholder="••••••••">
                        <span class="mensaje-error text-danger small mt-1 d-block" id="error-confirmar-contrasena"></span>
                    </div>

                    <!-- Región -->
                    <div class="campo col-md-6">
                        <label for="region" class="form-label fw-semibold">Región</label>
                        <select class="form-select" id="region" name="region">
                            <option value="">-- Seleccione la región --</option>
                            <option value="metropolitana">Región Metropolitana de Santiago</option>
                            <option value="valparaiso">Región de Valparaíso</option>
                            <option value="nuble">Región de Ñuble</option>
                            <option value="bioBio">Región del Biobío</option>
                            <option value="araucania">Región de la Araucanía</option>
                        </select>
                        <span class="mensaje-error text-danger small mt-1 d-block" id="error-region"></span>
                    </div>

                    <!-- Comuna -->
                    <div class="campo col-md-6">
                        <label for="comuna" class="form-label fw-semibold">Comuna</label>
                        <select class="form-select" id="comuna" name="comuna">
                            <option value="">-- Seleccione la comuna --</option>
                        </select>
                        <span class="mensaje-error text-danger small mt-1 d-block" id="error-comuna"></span>
                    </div>

                    <!-- Dirección -->
                    <div class="campo col-12">
                        <label for="direccion" class="form-label fw-semibold">Dirección</label>
                        <input type="text" class="form-control" id="direccion" name="direccion" placeholder="Calle, número, depto">
                        <span class="mensaje-error text-danger small mt-1 d-block" id="error-direccion"></span>
                    </div>

                    <!-- Botón submit -->
                    <div class="col-12 mt-4">
                        <button type="submit" class="btn btn-danger w-100 btn-lg fw-bold shadow-sm mb-3">Registrar</button>
                        <p class="text-center text-muted mb-0" style="font-size: 0.95rem;">
                            ¿Ya tienes una cuenta? <a href="login.html" class="text-danger fw-bold text-decoration-underline">Inicia sesión aquí</a>
                        </p>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-4 mt-auto border-top border-secondary">
        <div class="container">
            <p class="mb-0 text-white-50">&copy; 2026 ForkMenu. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- Scripts de Bootstrap y Lógica JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/validaciones.js"></script>
</body>
</html>
